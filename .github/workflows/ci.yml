name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 只讀 repo，不需要寫入權限
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # contracts（Hardhat）+ issuer-verifier（vitest）
  # ---------------------------------------------------------------
  node:
    name: Node — contracts + issuer-verifier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本以 root package.json 的 packageManager 欄位為準
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # --frozen-lockfile：lockfile 與 package.json 不一致就直接失敗
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build contracts (hardhat compile)
        run: pnpm contracts:build

      # root `test` = contracts + issuer-verifier
      - name: Test
        run: pnpm test

      - name: Build issuer-verifier
        run: pnpm iv:build

      - name: Build wallet
        run: pnpm wallet:build

  # ---------------------------------------------------------------
  # ai-service（pytest）
  # 註：packages/ai-service 的 npm scripts 走 scripts/venv-python.mjs（跨平台），
  #     但 CI 沒必要多包一層 venv，直接 pip 裝進 runner 的 Python 再跑 pytest。
  # ---------------------------------------------------------------
  python:
    name: Python — ai-service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 與 packages/ai-service/Dockerfile 一致；requirements.txt 釘死的 numpy 2.5 需要 3.12+
          python-version: "3.13"
          cache: pip
          cache-dependency-path: packages/ai-service/requirements.txt

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # tests 需要 model.joblib（app 啟動時載入）
      - name: Train model (synthetic, fixed seed)
        run: python train.py

      - name: Pytest
        run: python -m pytest -q

  # ---------------------------------------------------------------
  # 基礎設施設定檔的靜態驗證（不啟動任何服務）
  # ---------------------------------------------------------------
  infra:
    name: Infra — compose / nginx 設定驗證
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      # nginx.conf 是 envsubst 樣板，先展開再驗（直接餵樣板會因 ${...} 未展開而誤判）。
      # 三個佔位符都要給值：漏給的會原樣留成 ${...}，nginx 把它當成未定義變數而失敗。
      # 上游刻意用 127.0.0.1 而非 compose 的服務名 issuer-verifier：nginx -t 會在啟動時
      # 解析 proxy_pass 的主機名，單獨跑的容器裡解析不到服務名，這個 job 先前就是一直卡在這裡。
      - name: Validate wallet nginx.conf.template
        run: |
          docker run --rm \
            -e CHAINTRUST_API_KEY=ci-dummy-key \
            -e CHAINTRUST_IV_URL=http://127.0.0.1:3001 \
            -e CHAINTRUST_IV_HOST=127.0.0.1 \
            -v "$PWD/packages/wallet/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            nginxinc/nginx-unprivileged:1.27-alpine \
            sh -c '/docker-entrypoint.sh nginx -t'
