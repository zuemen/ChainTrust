server {
  # 8080 而非 80：映像是 nginx-unprivileged，以非 root（uid 101）執行，
  # 綁不了 <1024 的特權埠。對外仍是 compose 的 5173:8080。
  listen 8080;
  server_name _;

  # 不洩漏 nginx 版本
  server_tokens off;

  # === 安全標頭（全部 always，錯誤頁也要送）=======================
  # 錢包的 holder 私鑰存在瀏覽器裡，CSP 是 XSS 竊鑰的縱深防禦最後一道。
  #  - script-src 'self'：Vite 產物是外部 .js（dist/index.html 無 inline script），不需要 unsafe-inline
  #  - style-src 'self'：CSS 打包成外部 .css；React 的 style={{}} 走 CSSOM 不受 CSP 管
  #  - img-src 'self' data:：manifest.webmanifest 的 icon 是 data:image/svg+xml URI，必須放行 data:
  #  - connect-src 'self'：前端 API base 是同源的 /api（由本檔反代到 issuer-verifier）
  #  - frame-ancestors 'none'：擋 clickjacking——「同意出示憑證」對話框不可被塞進 iframe 誘導點擊
  #  - base-uri / form-action 'none'：擋 <base> 綁架與表單外送
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  # PoC 走 http://localhost，不下 HSTS（下了會把 localhost 整個網域鎖成 https）。
  # 真上 TLS 網域時再加：
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # /api/* 轉發到 issuer-verifier（去掉 /api 前綴，與 vite proxy 行為一致）
  location /api/ {
    proxy_pass http://issuer-verifier:3001/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 後端若自帶標頭，以本層為準（避免重複 CSP 造成兩份政策取交集）
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
  }

  # SPA 靜態檔
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
