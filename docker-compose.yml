# 一鍵起整個 ChainTrust Demo（需 Docker Desktop 運行中）
#   cp .env.example .env   # 至少填 API_KEY（保護 /revoke、/sdjwt/issue）
#   docker compose up --build
#   → 錢包 http://localhost:5173
#
# 安全預設：
#   - issuer-verifier / ai-service 只綁 127.0.0.1，不對同網段公開。
#     錢包容器內部走 service name（nginx 反代 /api/ → issuer-verifier:3001），
#     對外只需要 5173。若真要遠端存取 API，請自行改 ports 並確認已設 API_KEY。
#   - API_KEY / CORS_ORIGIN 由 .env 或 shell 環境變數注入，不寫死在檔案裡。
services:
  ai-service:
    build:
      context: .
      dockerfile: packages/ai-service/Dockerfile
    environment:
      PORT: "8000"
    # 只對本機開放（容器間仍可用 http://ai-service:8000 互通）
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - "-c"
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  issuer-verifier:
    build:
      context: .
      dockerfile: packages/issuer-verifier/Dockerfile
    environment:
      # 預設 memory；上真鏈時：CHAIN_MODE=ethers docker compose up
      # （需先完成 Amoy 部署，見 docs/amoy-deploy-checklist.md）
      CHAIN_MODE: ${CHAIN_MODE:-memory}
      AMOY_RPC_URL: ${AMOY_RPC_URL:-https://rpc-amoy.polygon.technology}
      CHAIN_PRIVATE_KEY: ${CHAIN_PRIVATE_KEY:-}
      # mutating 端點（/revoke、/sdjwt/issue、/issue/*）的守門金鑰。
      # 留空 = dev 模式不設防；正式 demo 請在 .env 設一個長隨機字串。
      API_KEY: ${API_KEY:-}
      # CORS 允許來源；預設只放行錢包前端
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      AI_SERVICE_URL: http://ai-service:8000
      PORT: "3001"
    # 只對本機開放（wallet 容器透過 nginx 反代 /api/ 內部連線）
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - "-e"
        - "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      ai-service:
        condition: service_healthy

  wallet:
    build:
      context: .
      dockerfile: packages/wallet/Dockerfile
    # 容器內是 8080（nginx-unprivileged 以非 root 執行，綁不了特權埠）
    ports:
      - "5173:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    # nginx 啟動即會解析 upstream，issuer-verifier 必須先 healthy
    depends_on:
      issuer-verifier:
        condition: service_healthy
