# 一鍵起整個 ChainTrust Demo（需 Docker Desktop 運行中）
#   docker compose up --build
#   → 錢包 http://localhost:5173
services:
  ai-service:
    build:
      context: .
      dockerfile: packages/ai-service/Dockerfile
    ports:
      - "8000:8000"

  issuer-verifier:
    build:
      context: .
      dockerfile: packages/issuer-verifier/Dockerfile
    environment:
      # 預設 memory；上真鏈時：CHAIN_MODE=ethers docker compose up
      # （需先完成 Amoy 部署，見 docs/amoy-deploy-checklist.md）
      CHAIN_MODE: ${CHAIN_MODE:-memory}
      AMOY_RPC_URL: ${AMOY_RPC_URL:-https://rpc-amoy.polygon.technology}
      CHAIN_PRIVATE_KEY: ${CHAIN_PRIVATE_KEY:-}
      AI_SERVICE_URL: http://ai-service:8000
      PORT: "3001"
    ports:
      - "3001:3001"
    depends_on:
      - ai-service

  wallet:
    build:
      context: .
      dockerfile: packages/wallet/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - issuer-verifier
